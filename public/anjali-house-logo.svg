<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <!-- Red Roof Outline -->
  <path d="M 14 118 L 150 10 L 286 118" fill="none" stroke="#EF3D43" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Red Heart floating above left roof slope -->
  <g transform="translate(62, 33) rotate(-14) scale(0.68)">
    <path d="M 0 -6 C -7 -24 -32 -20 -32 6 C -32 25 0 46 0 46 C 0 46 32 25 32 6 C 32 -20 7 -24 0 -6 Z" fill="#EF3D43"/>
  </g>

  <!-- Green Smiley Face -->
  <!-- Left Eye -->
  <circle cx="141" cy="34" r="4.8" fill="#8FA91C"/>
  <!-- Right Eye -->
  <circle cx="159" cy="34" r="4.8" fill="#8FA91C"/>
  <!-- Smile Arc -->
  <path d="M 120 38 C 120 68 180 68 180 38" fill="none" stroke="#8FA91C" stroke-width="6" stroke-linecap="round"/>

  <!-- "anjali" Hand-Drawn Letters -->
  <!-- 'a' - Golden Yellow -->
  <path d="M 88 107 C 88 97 76 96 68 99 C 63 101 62 105 63 110 C 64 116 70 118 77 118 C 83 118 88 114 88 107 Z" fill="none" stroke="#FDB813" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
